name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

permissions: {}

jobs:
  pre-commit:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
          no-cache: true
      - name: Run prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        background: true
        with:
          cache: false
      - name: Run PyLint
        run: pipx run --python=python hatch run pylint:lint --output-format=github
        background: true
      - name: Install with cache
        run: bun install --frozen-lockfile
      - name: Run linter
        run: bun run lint
      - name: Run type checker
        run: bun run type
      - name: Run tests
        run: bun run test
      - name: Wait for prek and PyLint
        wait-all:

  checks:
    name: Check Python on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Last one is activated
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        background: true
        with:
          python-version: |
            3.11
            3.12
            3.14
            3.13

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      # Faster than setup-python for these versions
      - name: Install Python 3.15
        shell: bash
        run: |
          uv python install 3.15
          uv python dir --bin >> "$GITHUB_PATH"

      - wait-all:

      # Creating the config in parallel races on Windows
      - name: Install hatch
        run: |
          uv pip install --system hatch
          hatch config restore

      - parallel:
          - name: Test Python 3.11
            run: hatch test -py 3.11
          - name: Test Python 3.12
            run: hatch test -py 3.12
          - name: Test Python 3.13
            run: hatch test -py 3.13
          - name: Test Python 3.14
            run: hatch test -py 3.14
          - name: Test Python 3.15
            run: hatch test -py 3.15

  dist:
    name: Distribution build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install hatch
        run: uv pip install --system hatch

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
          no-cache: true

      - name: Install with cache
        run: bun install --frozen-lockfile

      - name: Build webapp
        run: bun run build

      - name: Linkcheck
        run: hatch run docs:linkcheck

      - name: Build docs with warnings as errors
        run: hatch run docs:html -W

      - name: Verify no changes required to API docs
        run: |
          hatch run api-docs:build
          git diff --exit-code

  action:
    name: Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run repo-review action
        uses: $/
        with:
          plugins: sp-repo-review==2026.08.14
